server:
  port: 8080

logging:
  level:
    org.zalando.logbook: TRACE

spring:
  h2:
    console:
      enabled: true

  sql:
    init:
      mode: always

  datasource:
    url: jdbc:h2:mem:./db/filmorate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect